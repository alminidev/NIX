name: nix-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: nix-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nix
    volumes:
      - nix_postgres_dev:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nix"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  nix_postgres_dev:
